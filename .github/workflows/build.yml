name: Build K50 GKI Kernel (KernelSU 多分支)

on:
  workflow_dispatch:
    inputs:
      ksu_flavor:
        description: '要集成的 KernelSU 分支（none = 纯净内核，供 YukiSU 等 LKM 方案加载 .ko）'
        required: false
        default: 'resukisu'
        type: choice
        options:
          - resukisu
          - none
          - apkesu
          - kowsu
          - sukisu
          - next
          - official
          - custom
      ksu_repo:
        description: '自定义仓库地址（仅在 flavor=custom 时需要）'
        required: false
        default: ''
      ksu_ref:
        description: '分支 / tag（下载 setup.sh 会依次尝试此值 -> main -> master）'
        required: false
        default: 'main'
      kernel_compress:
        description: '内核压缩格式（必须与原厂 boot.img 一致）'
        required: false
        default: 'gz'
        type: choice
        options:
          - gz
          - lz4
          - none
      ksu_mode:
        description: 'KernelSU 构建方式'
        required: false
        default: 'y'
        type: choice
        options:
          - y
          - m
      ztc_branch:
        description: 'ztc1997 内核分支（留空=默认分支）'
        required: false
        default: ''
      enable_susfs:
        description: '集成 SUSFS 内核级隐藏（需分支支持，如 ReSukiSU / SukiSU-Ultra）'
        required: false
        default: true
        type: boolean
      susfs_repo:
        description: 'SUSFS 自定义仓库（留空=依次尝试官方 GitLab 与 GitHub 镜像）'
        required: false
        default: ''
      susfs_branch:
        description: 'SUSFS 补丁分支，须与内核版本对应'
        required: false
        default: 'gki-android12-5.10'
        type: choice
        options:
          - gki-android12-5.10
          - gki-android13-5.10
          - gki-android13-5.15
          - gki-android14-5.15
          - gki-android14-6.1
          - gki-android15-6.6
      remove_abi_exports:
        description: '移除 GKI 受保护符号导出表（厂商模块加载失败时勾选）'
        required: false
        default: false
        type: boolean
  # 注意：不要加 push 触发，否则每次提交文件都会自动跑一次 1 小时的编译

jobs:
  build:
    name: Build Kernel + AnyKernel3
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KSU_FLAVOR: ${{ github.event.inputs.ksu_flavor || 'resukisu' }}
      KSU_REPO: ${{ github.event.inputs.ksu_repo || '' }}
      KSU_REF: ${{ github.event.inputs.ksu_ref || 'main' }}
      ENABLE_SUSFS: ${{ github.event.inputs.enable_susfs && '1' || '0' }}
      SUSFS_BRANCH: ${{ github.event.inputs.susfs_branch || 'gki-android12-5.10' }}
      SUSFS_REPO: ${{ github.event.inputs.susfs_repo || '' }}
      KERNEL_COMPRESS: ${{ github.event.inputs.kernel_compress || 'gz' }}
      ENABLE_KSU: ${{ github.event.inputs.ksu_mode || 'y' }}
      ZTC_BRANCH: ${{ github.event.inputs.ztc_branch || '' }}
      REMOVE_ABI_EXPORTS: ${{ github.event.inputs.remove_abi_exports && '1' || '' }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg \
            libelf-dev libssl-dev lzop python3 python3-setuptools \
            rsync schedtool unzip zip zlib1g-dev repo
          git config --global user.name  "builder"
          git config --global user.email "builder@local"

      - name: 启用 ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 2G
          key: gki-k50-${{ env.KSU_REF }}-${{ env.KERNEL_COMPRESS }}

      - name: 同步 GKI 源码树
        run: bash build.sh sync

      - name: 替换为 ztc1997 内核源码
        run: bash build.sh replace

      - name: 集成 KernelSU 分支
        run: bash build.sh ksu

      - name: 集成 SUSFS
        run: bash build.sh susfs

      - name: 绕过 GKI 构建校验
        run: bash build.sh patch

      - name: 编译内核
        run: bash build.sh kernel

      - name: 打包 AnyKernel3
        run: bash build.sh pack

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: K50-kernel-output
          path: out/*
          if-no-files-found: error

      - name: 上传构建日志（失败时也保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
          if-no-files-found: warn

      - name: 输出摘要
        run: |
          echo "### 构建完成 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- KernelSU 分支: flavor=\`$KSU_FLAVOR\` / ref=\`$KSU_REF\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "$KSU_REPO" ]; then
            echo "- 自定义仓库: \`$KSU_REPO\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- 构建方式: CONFIG_KSU=\`$ENABLE_KSU\`" >> $GITHUB_STEP_SUMMARY
          if [ "$ENABLE_SUSFS" = "1" ]; then
            echo "- SUSFS: 已启用（分支 \`$SUSFS_BRANCH\`）" >> $GITHUB_STEP_SUMMARY
          else
            echo "- SUSFS: 未启用" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- 内核压缩: \`$KERNEL_COMPRESS\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ 刷入前务必先 \`fastboot boot\` 临时启动验证硬件正常" >> $GITHUB_STEP_SUMMARY
